# Perfil "dev": banco H2 em memoria, em modo de compatibilidade com Oracle.
# Serve para rodar e testar a API sem acesso ao servidor da FIAP.
spring.datasource.url=jdbc:h2:mem:rotaseca;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
