spring.application.name=rota-seca-api

# Porta: o Render informa a porta pela variavel PORT
server.port=${PORT:8080}

# Banco Oracle da FIAP (credenciais sempre por variavel de ambiente, nunca no codigo)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=3

# Criacao das tabelas: SQL_INIT_MODE=always apenas no primeiro deploy, depois volte para never
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8

# Datas no formato ISO (2026-11-16T18:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
